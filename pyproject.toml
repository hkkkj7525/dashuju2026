[project]
name = "baseline"
version = "0.1.0"
description = "BDC2026 stock ranking baseline"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "akshare>=1.18.28",
    "baostock>=0.8.9",
    "joblib>=1.5.2",
    "pandas>=2.3.2",
    "scikit-learn>=1.7.2",
    "seaborn>=0.13.2",
    "ta-lib>=0.6.8",
    "tensorboard>=2.20.0",
    "tensorboardx>=2.6.4",
    "torch>=2.6.0",
    "tqdm>=4.67.1",
]

# 比赛方机器有 RTX 4060 时，可在构建时使用 CUDA 基础镜像并加 --extra-index-url；
# 默认从 PyPI 拉 CPU 版 torch（约 200MB），保证轻量、跨平台。

