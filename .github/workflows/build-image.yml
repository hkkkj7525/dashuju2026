name: Build bdc2026 Docker Image

# 触发条件：推送到 main / master，或手动触发
on:
  push:
    branches: [main, master]
  workflow_dispatch:

# 同一时间只跑一个构建
concurrency:
  group: build-bdc2026
  cancel-in-progress: false

env:
  IMAGE_NAME: bdc2026
  OUTPUT_TAR: 666这不阴.tar
  BASE_IMAGE: python:3.12-slim-bookworm   # 改用轻量 CPU 基础镜像

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          echo "=== 清理前空间 ==="
          df -h
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af 2>/dev/null || true
          echo "=== 清理后空间 ==="
          df -h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Build bdc2026 image (linux/amd64, CPU base)
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --build-arg IMAGE_NAME=${BASE_IMAGE} \
            --cache-from type=local,src=/tmp/.buildx-cache \
            --cache-to type=local,dest=/tmp/.buildx-cache-new,mode=max \
            --tag ${IMAGE_NAME}:latest \
            --load \
            .

      - name: Move cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

      - name: Verify image (no docker run; just inspect)
        run: |
          echo "=== 镜像信息 ==="
          docker images | grep bdc2026
          echo ""
          echo "=== 镜像历史（确认层数） ==="
          docker history "${IMAGE_NAME}:latest" | head -30
          echo ""
          echo "=== 镜像元信息（Cmd/Entrypoint） ==="
          docker inspect --format='{{.Config.Cmd}}' "${IMAGE_NAME}:latest"
          echo "WORKDIR: $(docker inspect --format='{{.Config.WorkingDir}}' ${IMAGE_NAME}:latest)"

      - name: Save image to tar
        run: |
          docker save -o "${OUTPUT_TAR}" "${IMAGE_NAME}:latest"
          echo "=== Tar size ==="
          ls -lh "${OUTPUT_TAR}"
          echo "=== Tar sha256 ==="
          sha256sum "${OUTPUT_TAR}" | tee "${OUTPUT_TAR}.sha256"

      - name: Upload tar to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "666这不阴 - Docker Image"
          body: |
            ## 构建结果
            - **基础镜像**: ${BASE_IMAGE}
            - **镜像**: ${IMAGE_NAME}:latest
            - **Tar 文件**: ${OUTPUT_TAR}
            - **大小**: $(du -h "${OUTPUT_TAR}" | cut -f1)
            - **SHA256**: $(sha256sum "${OUTPUT_TAR}" | cut -d' ' -f1)
            
            下载后验证：`sha256sum 666这不阴.tar`
          files: |
            666这不阴.tar
            666这不阴.tar.sha256
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        if: always()
        run: |
          echo "## 构建结果" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f "${OUTPUT_TAR}" ]; then
            echo "- **基础镜像**: ${BASE_IMAGE}" >> $GITHUB_STEP_SUMMARY
            echo "- **镜像**: ${IMAGE_NAME}:latest" >> $GITHUB_STEP_SUMMARY
            echo "- **Tar 文件**: ${OUTPUT_TAR}" >> $GITHUB_STEP_SUMMARY
            SIZE=$(du -h "${OUTPUT_TAR}" | cut -f1)
            echo "- **大小**: ${SIZE}" >> $GITHUB_STEP_SUMMARY
            SHA=$(sha256sum "${OUTPUT_TAR}" | cut -d' ' -f1)
            echo "- **SHA256**: ${SHA}" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "请到 **Releases** 页面下载：https://github.com/${{ github.repository }}/releases/tag/v1.0.0" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ 构建失败，请查看上方日志" >> $GITHUB_STEP_SUMMARY
          fi
