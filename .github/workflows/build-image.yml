name: Build bdc2026 Docker Image

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: build-bdc2026
  cancel-in-progress: false

env:
  IMAGE_NAME: bdc2026
  OUTPUT_TAR: 666这不阴.tar

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Free disk space
        run: |
          echo "=== 清理前空间 ==="
          df -h
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af 2>/dev/null || true
          echo "=== 清理后空间 ==="
          df -h

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build bdc2026 image (linux/amd64)
        id: build
        run: |
          set -e
          echo "=== 开始构建 ==="
          docker buildx build \
            --platform linux/amd64 \
            --build-arg IMAGE_NAME=python:3.12-slim-bookworm \
            --tag ${IMAGE_NAME}:latest \
            --load \
            . 2>&1 | tee /tmp/build.log
          echo "=== 构建完成 ==="
          docker images | grep bdc2026

      - name: Save image to tar
        id: save
        run: |
          set -e
          echo "=== 导出镜像 ==="
          docker save -o "${OUTPUT_TAR}" "${IMAGE_NAME}:latest"
          echo "=== Tar size ==="
          ls -lh "${OUTPUT_TAR}"
          echo "=== Tar sha256 ==="
          sha256sum "${OUTPUT_TAR}" | tee "${OUTPUT_TAR}.sha256"

      - name: Quick smoke test
        run: |
          set +e
          echo "=== 验证镜像 ==="
          docker images | grep bdc2026
          docker run --rm "${IMAGE_NAME}:latest" bash -c "python --version && python -c 'import torch; print(\"torch:\", torch.__version__)' && python -c 'import talib; print(\"talib ok\")'"
          echo "=== 烟雾测试通过 ==="

      - name: Upload tar as artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: bdc2026-tar
          path: |
            666这不阴.tar
            666这不阴.tar.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Build failure diagnostics
        if: failure()
        run: |
          echo "## ❌ 构建失败" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 构建日志末尾" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -100 /tmp/build.log 2>/dev/null >> $GITHUB_STEP_SUMMARY || echo "无构建日志" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Summary
        if: always()
        run: |
          echo "## 构建摘要" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f "${OUTPUT_TAR}" ]; then
            echo "- **镜像**: ${IMAGE_NAME}:latest" >> $GITHUB_STEP_SUMMARY
            echo "- **Tar 文件**: ${OUTPUT_TAR}" >> $GITHUB_STEP_SUMMARY
            SIZE=$(du -h "${OUTPUT_TAR}" | cut -f1)
            echo "- **大小**: ${SIZE}" >> $GITHUB_STEP_SUMMARY
            SHA=$(sha256sum "${OUTPUT_TAR}" | cut -d' ' -f1)
            echo "- **SHA256**: ${SHA}" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Tar 文件未生成，构建失败" >> $GITHUB_STEP_SUMMARY
          fi
